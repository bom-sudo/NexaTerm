<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NexaTerm App Icon</title>
  <desc id="desc">A geometric N monogram with a terminal cursor and connected-node accent on a midnight blue rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142A49"/>
      <stop offset="0.55" stop-color="#0B1930"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#147FD2" stop-opacity=".28"/>
      <stop offset="1" stop-color="#147FD2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".42" stop-color="#35BDF2"/>
      <stop offset="1" stop-color="#477BFF"/>
    </linearGradient>
    <linearGradient id="markHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".44"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.62  0 0 0 0 1  0 0 0 .52 0" result="colored"/>
      <feMerge><feMergeNode in="colored"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
    <rect x="24" y="24" width="464" height="464" fill="url(#glow)"/>
    <path d="M45 155H110M402 88H460M405 424H465M53 374H102" stroke="#69CFF5" stroke-opacity=".10" stroke-width="3" stroke-linecap="round"/>
    <path d="M88 112V84H132M380 428H424V394" fill="none" stroke="#69CFF5" stroke-opacity=".12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="105" cy="155" r="5" fill="#56DDF4" opacity=".38"/>
    <circle cx="407" cy="88" r="5" fill="#56DDF4" opacity=".38"/>
    <circle cx="405" cy="424" r="5" fill="#56DDF4" opacity=".38"/>
    <path d="M156 354V158L356 354V158" fill="none" stroke="#168BD6" stroke-opacity=".28" stroke-width="91" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <path d="M156 354V158L356 354V158" fill="none" stroke="url(#mark)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M156 354V158L356 354V158" fill="none" stroke="url(#markHighlight)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".62"/>
    <rect x="374" y="350" width="34" height="34" rx="9" fill="#62E6F4" filter="url(#softGlow)"/>
    <rect x="382" y="358" width="18" height="18" rx="4" fill="#E9FDFF" opacity=".92"/>
  </g>
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="#A9DDFB" stroke-opacity=".17" stroke-width="3"/>
</svg>