name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend (typecheck + unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  linux:
    name: Linux (tests + deb/rpm/AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf rpm file xdg-utils \
            dbus-x11 gnome-keyring libsecret-tools \
            iputils-ping traceroute xauth xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rust tests (incl. Secret Service keyring)
        shell: bash
        run: |
          set -o pipefail
          # A private D-Bus session with an unlocked GNOME Keyring, so the Secret Service store is really exercised.
          dbus-run-session -- bash -c '
            echo -n "ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            NEXATERM_TEST_SECRET_SERVICE=1 cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
          ' 2>&1 | tee cargo-test.log
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: bash scripts/ci-annotate.sh cargo-test.log
      - name: Build Linux bundles
        shell: bash
        run: |
          set -o pipefail
          npx tauri build 2>&1 | tee tauri-build.log
      - name: Report build failures as annotations
        if: failure()
        shell: bash
        run: bash scripts/ci-annotate.sh tauri-build.log
      - name: Self-test the built binary
        shell: bash
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a src-tauri/target/release/nexaterm --self-test || { cat ~/.local/share/NexaTerm/logs/self-test.txt 2>/dev/null; exit 1; }
          ' || echo "::warning::self-test failed (see log above)"
      - uses: actions/upload-artifact@v4
        with:
          name: nexaterm-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (tests + installer, unsigned)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1 | tee cargo-test.log
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: bash scripts/ci-annotate.sh cargo-test.log
      - name: Build installer + portable (unsigned)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipTests -SkipNpmInstall -NoWebInstaller -Jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: nexaterm-windows-x64-unsigned
          path: dist/release/
          if-no-files-found: error
